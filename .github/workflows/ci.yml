name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

jobs:
  test:
    runs-on: [self-hosted, macos, arm64]
    permissions:
      contents: read
      issues: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Isolate CARGO_HOME + RUSTUP_HOME (#1285)
        run: |
          echo "CARGO_HOME=$RUNNER_TEMP/cargo-home" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup-home" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/cargo-home/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Inline-comment absolute-rule check (#1345 force-push backstop)
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}"
          git diff --unified=0 "$base"..HEAD -- '*.rs' '*.ts' '*.tsx' '*.js' '*.jsx' \
            | scripts/check-inline-comments.sh
      - name: Test (offline; no real outside-this-computer calls per Ryan 2026-05-05)
        env:
          BPMUX_SESSION_BASE: ${{ runner.temp }}/bpmux-sessions
        run: cargo test
      - name: Audit
        run: |
          cargo install cargo-audit
          cargo audit
      - name: Verify Ryan's $HOME state preserved (#1285 regression gate)
        run: scripts/verify-home-isolation.sh

  vitest-rtl:
    runs-on: [self-hosted, macos, arm64]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Isolate CARGO_HOME + RUSTUP_HOME (#1285)
        run: |
          echo "CARGO_HOME=$RUNNER_TEMP/cargo-home-vitest" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup-home-vitest" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/cargo-home-vitest/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "vitest-rtl"
      - name: Build bpmux binary (debug; vitest globalSetup requires target/debug/bpmux)
        run: cargo build -p bpmux
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: applications/electron/package-lock.json
      - name: Install Electron deps
        working-directory: applications/electron
        run: npm ci
      - name: Vitest (RTL + real-backend)
        working-directory: applications/electron
        run: npx vitest run --retry=2

  build-bpmux:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[e2e]')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "playwright-e2e"
      - name: Build bpmux binary
        run: cargo build --bin bpmux
      - name: Smoke-check binary
        run: target/debug/bpmux --help > /dev/null
      - name: Upload bpmux artifact
        uses: actions/upload-artifact@v4
        with:
          name: bpmux-binary
          path: target/debug/bpmux
          retention-days: 1
          if-no-files-found: error

  playwright-e2e:
    needs: build-bpmux
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[e2e]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - name: Download bpmux artifact
        uses: actions/download-artifact@v4
        with:
          name: bpmux-binary
          path: target/debug
      - name: Make bpmux executable + smoke-check
        run: |
          chmod +x target/debug/bpmux
          target/debug/bpmux --help > /dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: applications/electron/package-lock.json
      - name: Install Electron deps
        working-directory: applications/electron
        run: npm ci
      - name: Build Electron bundle (out/main/index.js)
        working-directory: applications/electron
        run: npm run build
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('applications/electron/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright + system deps (xvfb, fonts, etc)
        working-directory: applications/electron
        run: npx playwright install --with-deps
      - name: Run Playwright shard ${{ matrix.shard }}/6 under xvfb
        working-directory: applications/electron
        run: xvfb-run --auto-servernum npx playwright test --reporter=dot --shard=${{ matrix.shard }}/6 --workers=4
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-shard-${{ matrix.shard }}
          path: |
            applications/electron/test-results/
            applications/electron/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
