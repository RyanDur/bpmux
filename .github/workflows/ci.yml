name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  build-bpmux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "playwright-e2e"
      - name: Build bpmux binary
        run: cargo build --bin bpmux
      - name: Smoke-check binary
        run: target/debug/bpmux --help > /dev/null
      - name: Upload bpmux artifact
        uses: actions/upload-artifact@v4
        with:
          name: bpmux-binary
          path: target/debug/bpmux
          retention-days: 1
          if-no-files-found: error

  test:
    runs-on: [self-hosted, macos, arm64]
    permissions:
      contents: read
      issues: read
      actions: read
    # #1285: $HOME-isolation on bpmux-mac-m1 self-hosted runner. The
    # runner runs as Ryan's user with Ryan's $HOME, so any action that
    # writes to ~/.cargo, ~/.rustup, ~/.npm, etc. corrupts Ryan's live
    # dev state. Empirical incident (dev 2026-05-11 03:28 UTC): the
    # dtolnay/rust-toolchain action wiped ~/.cargo/bin/rustup mid-CI.
    # Strategy: action-cache redirect via CARGO_HOME/RUSTUP_HOME env
    # vars pointing at $RUNNER_TEMP-private paths. dtolnay/rust-toolchain
    # respects these (standard rustup env vars); Swatinem/rust-cache@v2
    # caches via the configured CARGO_HOME so cache paths follow.
    # PATH update prepends the redirected cargo/bin so all later steps
    # find the installed rust toolchain.
    env:
      CARGO_HOME: ${{ runner.temp }}/cargo
      RUSTUP_HOME: ${{ runner.temp }}/rustup
    steps:
      - uses: actions/checkout@v4
      - name: Prepend isolated CARGO_HOME/bin to PATH
        run: echo "${{ runner.temp }}/cargo/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Verify $HOME-isolation (#1285)
        # Fail-loud if any toolchain action wrote into Ryan's user $HOME.
        # Sister-shape regression test inside CI itself (AC 6-7).
        run: |
          if [ -d "$HOME/.rustup/toolchains" ] && find "$HOME/.rustup/toolchains" -mindepth 1 -maxdepth 1 -newer "$GITHUB_WORKSPACE" -print -quit | grep -q . ; then
            echo "::error::#1285 violation: $HOME/.rustup/toolchains was modified during this CI run; isolation broke."
            exit 1
          fi
          if [ -f "$HOME/.cargo/bin/rustup" ] && [ "$HOME/.cargo/bin/rustup" -nt "$GITHUB_WORKSPACE" ]; then
            echo "::error::#1285 violation: $HOME/.cargo/bin/rustup was modified during this CI run."
            exit 1
          fi
          echo "#1285: $HOME-isolation OK; CARGO_HOME=$CARGO_HOME RUSTUP_HOME=$RUSTUP_HOME"
          ls -la "$CARGO_HOME/bin" || true
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Test (offline; no real outside-this-computer calls per Ryan 2026-05-05)
        env:
          BPMUX_SESSION_BASE: ${{ runner.temp }}/bpmux-sessions
        run: cargo test
      - name: Audit
        run: |
          cargo install cargo-audit
          cargo audit

  playwright-e2e:
    needs: build-bpmux
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - name: Download bpmux artifact
        uses: actions/download-artifact@v4
        with:
          name: bpmux-binary
          path: target/debug
      - name: Make bpmux executable + smoke-check
        run: |
          chmod +x target/debug/bpmux
          target/debug/bpmux --help > /dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: applications/electron/package-lock.json
      - name: Install Electron deps
        working-directory: applications/electron
        run: npm ci
      - name: Build Electron bundle (out/main/index.js)
        working-directory: applications/electron
        run: npm run build
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('applications/electron/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright + system deps (xvfb, fonts, etc)
        working-directory: applications/electron
        run: npx playwright install --with-deps
      - name: Run Playwright shard ${{ matrix.shard }}/6 under xvfb
        working-directory: applications/electron
        run: xvfb-run --auto-servernum npx playwright test --reporter=dot --shard=${{ matrix.shard }}/6 --workers=4
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-shard-${{ matrix.shard }}
          path: |
            applications/electron/test-results/
            applications/electron/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
