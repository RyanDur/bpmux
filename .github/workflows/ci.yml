name: CI

on:
  push:
    branches: [main]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Install the toolchain pinned in rust-toolchain.toml so CI runs
      # the same rustc/clippy version developers do locally. Bumping
      # Rust is a single-file change at the repo root — no workflow
      # edit required. @master is the action revision that respects
      # rust-toolchain.toml when no `toolchain:` input is supplied.
      - uses: dtolnay/rust-toolchain@master
      - uses: Swatinem/rust-cache@v2
        with:
          # #222: skip caching target/ so the cache stays small enough
          # to save without hitting the runner's ~14GB disk limit.
          # Two disk-full failures today (runs 24507576081 and
          # 24490994629) both happened in the rust-cache Post step.
          # Keeping ~/.cargo/registry + ~/.cargo/git caches preserves
          # the dep-download speedup while dropping the biggest
          # artifact directory (webrtc + tokio + octocrab dominate
          # target/).
          cache-targets: "false"
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Test
        run: cargo test
        env:
          BPMUX_SESSION_BASE: ${{ runner.temp }}/bpmux-sessions
      - name: Audit
        run: |
          cargo install cargo-audit
          cargo audit
