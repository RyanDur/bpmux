name: CI

on:
  push:
    branches: [main]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Test
        run: cargo test
        env:
          BPMUX_SESSION_BASE: ${{ runner.temp }}/bpmux-sessions
      - name: Audit
        run: |
          cargo install cargo-audit
          cargo audit
