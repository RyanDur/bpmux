name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  # #1198: build bpmux once + share via artifact so the 6 playwright-e2e
  # shards don't each pay 5-8min of duplicate compile. Runs in parallel
  # with `test`. Wall-clock dominated by max(test, build-bpmux + slowest
  # shard) instead of max(test, slowest-shard-with-build).
  build-bpmux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "playwright-e2e"
      - name: Build bpmux binary
        run: cargo build --bin bpmux
      - name: Smoke-check binary
        run: target/debug/bpmux --help > /dev/null
      - name: Upload bpmux artifact
        uses: actions/upload-artifact@v4
        with:
          name: bpmux-binary
          path: target/debug/bpmux
          retention-days: 1
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Test (offline; no real outside-this-computer calls per Ryan 2026-05-05)
        env:
          BPMUX_SESSION_BASE: ${{ runner.temp }}/bpmux-sessions
        run: cargo test
      - name: Audit
        run: |
          cargo install cargo-audit
          cargo audit

  playwright-e2e:
    needs: build-bpmux
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      # #1198: download the binary built once by build-bpmux instead of
      # recompiling per shard. ~10s download vs 5-8min compile.
      - name: Download bpmux artifact
        uses: actions/download-artifact@v4
        with:
          name: bpmux-binary
          path: target/debug
      - name: Make bpmux executable + smoke-check
        run: |
          chmod +x target/debug/bpmux
          target/debug/bpmux --help > /dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: applications/electron/package-lock.json
      - name: Install Electron deps
        working-directory: applications/electron
        run: npm ci
      - name: Build Electron bundle (out/main/index.js)
        working-directory: applications/electron
        run: npm run build
      # #1198: cache Chromium + system-deps install per shard. Key on
      # package-lock.json hash so cache invalidates when Playwright
      # version bumps. ~2min savings per shard on a cache hit.
      # restore-keys fallback added per Ryan 2026-05-06 00:29 UTC +
      # img_8.png (23m 11s) vs img_9.png (4m 53s) — 5× variance on
      # this exact step. When package-lock.json changes but Playwright
      # version doesn't, partial-match restore is faster than full
      # re-download (chromium ~250MB).
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('applications/electron/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright + system deps (xvfb, fonts, etc)
        working-directory: applications/electron
        run: npx playwright install --with-deps
      - name: Run Playwright shard ${{ matrix.shard }}/6 under xvfb
        working-directory: applications/electron
        run: xvfb-run --auto-servernum npx playwright test --reporter=dot --shard=${{ matrix.shard }}/6 --workers=4
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-shard-${{ matrix.shard }}
          path: |
            applications/electron/test-results/
            applications/electron/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
