name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Test (offline + contract drift against live GitHub)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BPMUX_REPO: ${{ github.repository }}
          BPMUX_SESSION_BASE: ${{ runner.temp }}/bpmux-sessions
        run: cargo test --features integration_tests
      - name: Audit
        run: |
          cargo install cargo-audit
          cargo audit

  playwright-e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
          shared-key: "playwright-e2e"
      - name: Build bpmux
        run: cargo build --bin bpmux
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: applications/electron/package-lock.json
      - name: Install Electron deps
        working-directory: applications/electron
        run: npm ci
      - name: Build Electron bundle (out/main/index.js)
        working-directory: applications/electron
        run: npm run build
      - name: Install Playwright + system deps (xvfb, fonts, etc)
        working-directory: applications/electron
        run: npx playwright install --with-deps
      - name: Run Playwright shard ${{ matrix.shard }}/6 under xvfb
        working-directory: applications/electron
        run: xvfb-run --auto-servernum npx playwright test --reporter=dot --shard=${{ matrix.shard }}/6 --workers=4
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-shard-${{ matrix.shard }}
          path: |
            applications/electron/test-results/
            applications/electron/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
