name: CI

on:
  push:
    branches: [main]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Install the pinned rustc so CI runs the same version
      # developers use locally. Keep this in sync with
      # `rust-toolchain.toml` at the repo root — rustup respects
      # the file locally, dtolnay's action needs the version
      # explicitly. Bumping Rust is a two-line change: this value
      # and the toml's `channel`.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # #222: skip caching target/ so the cache stays small enough
          # to save without hitting the runner's ~14GB disk limit.
          # Two disk-full failures today (runs 24507576081 and
          # 24490994629) both happened in the rust-cache Post step.
          # Keeping ~/.cargo/registry + ~/.cargo/git caches preserves
          # the dep-download speedup while dropping the biggest
          # artifact directory (webrtc + tokio + octocrab dominate
          # target/).
          cache-targets: "false"
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Test
        run: cargo test
        env:
          BPMUX_SESSION_BASE: ${{ runner.temp }}/bpmux-sessions
      - name: Audit
        run: |
          cargo install cargo-audit
          cargo audit

  # Contract drift check — runs the feature-gated integration suite
  # against live gh CLI + octocrab REST API. `needs: test` gates this
  # on the offline suite passing so we don't burn rate-limit budget on
  # already-broken code. Trunk-based development: every push to main
  # verifies contracts haven't drifted.
  #
  # Uses the built-in `GITHUB_TOKEN` that Actions provides on every run
  # (documented at docs.github.com/en/actions/security-guides/automatic-token-authentication).
  # `BPMUX_REPO` is the repo identifier itself — hardcoded here, not a
  # secret. No setup required per-repo; the job runs on every push.
  integration:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      # Read-only access to the current repo's issues + runs is enough
      # for the contract suite; explicit per-job scoping per Actions
      # least-privilege guidance.
      contents: read
      issues: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
      - name: Install gh CLI
        run: |
          # gh CLI is preinstalled on ubuntu-latest runners as of 2023,
          # but guard in case the baseline image shifts.
          if ! command -v gh >/dev/null; then
            curl -sS https://webi.sh/gh | sh
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
      - name: Run integration tests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BPMUX_REPO: ${{ github.repository }}
          BPMUX_SESSION_BASE: ${{ runner.temp }}/bpmux-sessions
        run: cargo test --features integration_tests -- --nocapture
