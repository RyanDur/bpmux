name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  build-bpmux:
    runs-on: [self-hosted, macos, arm64]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "playwright-e2e"
      - name: Build bpmux binary
        run: cargo build --bin bpmux
      - name: Smoke-check binary
        run: target/debug/bpmux --help > /dev/null
      - name: Upload bpmux artifact
        uses: actions/upload-artifact@v4
        with:
          name: bpmux-binary
          path: target/debug/bpmux
          retention-days: 1
          if-no-files-found: error

  test:
    runs-on: [self-hosted, macos, arm64]
    permissions:
      contents: read
      issues: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Test (offline; no real outside-this-computer calls per Ryan 2026-05-05)
        env:
          BPMUX_SESSION_BASE: ${{ runner.temp }}/bpmux-sessions
        run: cargo test
      - name: Audit
        run: |
          cargo install cargo-audit
          cargo audit

  playwright-e2e:
    needs: build-bpmux
    runs-on: [self-hosted, macos, arm64]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - name: Download bpmux artifact
        uses: actions/download-artifact@v4
        with:
          name: bpmux-binary
          path: target/debug
      - name: Make bpmux executable + smoke-check
        run: |
          chmod +x target/debug/bpmux
          target/debug/bpmux --help > /dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: applications/electron/package-lock.json
      - name: Install Electron deps
        working-directory: applications/electron
        run: npm ci
      - name: Build Electron bundle (out/main/index.js)
        working-directory: applications/electron
        run: npm run build
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('applications/electron/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright (macOS native windowing; no apt deps)
        working-directory: applications/electron
        run: npx playwright install
      - name: Run Playwright shard ${{ matrix.shard }}/6 (BPMUX_TEST_MODE hides windows)
        working-directory: applications/electron
        run: npx playwright test --reporter=dot --shard=${{ matrix.shard }}/6 --workers=4
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-shard-${{ matrix.shard }}
          path: |
            applications/electron/test-results/
            applications/electron/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
