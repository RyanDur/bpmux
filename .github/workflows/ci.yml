name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    runs-on: [self-hosted, macos, arm64]
    permissions:
      contents: read
      issues: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Isolate CARGO_HOME + RUSTUP_HOME (#1285)
        run: |
          echo "CARGO_HOME=$RUNNER_TEMP/cargo-home" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup-home" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/cargo-home/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Inline-comment absolute-rule check (#1345 force-push backstop)
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}"
          git diff --unified=0 "$base"..HEAD -- '*.rs' '*.ts' '*.tsx' '*.js' '*.jsx' \
            | scripts/check-inline-comments.sh
      - name: Test (offline; no real outside-this-computer calls per Ryan 2026-05-05)
        env:
          BPMUX_DATA_BASE: ${{ runner.temp }}/bpmux-data
        run: cargo test
      - name: Install cargo-audit (pre-built; avoids the ~1-2min source recompile every run — CARGO_HOME is per-run-isolated so the installed binary is never cached)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit
        run: cargo audit
      - name: Verify Ryan's $HOME state preserved (#1285 regression gate)
        run: scripts/verify-home-isolation.sh

  vitest-rtl:
    runs-on: [self-hosted, macos, arm64]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Isolate CARGO_HOME + RUSTUP_HOME (#1285)
        run: |
          echo "CARGO_HOME=$RUNNER_TEMP/cargo-home-vitest" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup-home-vitest" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/cargo-home-vitest/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "vitest-rtl"
      - name: Build bpmux binary (debug; vitest globalSetup requires target/debug/bpmux)
        run: cargo build -p composition-root
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: applications/electron/package-lock.json
          registry-url: "https://npm.pkg.github.com"
      - name: Install Electron deps
        working-directory: applications/electron
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci
      - name: Dependency rules
        working-directory: applications/electron
        run: npm run depcruise
      - name: ESLint (staged files; baseline tolerated until Epic #1477 sub-slices retire)
        working-directory: ${{ github.workspace }}
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}"
          ts_files=$(git diff --name-only --diff-filter=d "$base"..HEAD \
            | grep -E '^applications/electron/(src|tests)/.*\.(ts|tsx)$' \
            | sed 's|^applications/electron/||' || true)
          if [ -n "$ts_files" ]; then
            (cd applications/electron && echo "$ts_files" | xargs npx eslint --no-warn-ignored)
          fi
      - name: Stylelint (staged files; baseline tolerated until Epic #1477 sub-slices retire)
        working-directory: ${{ github.workspace }}
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}"
          css_files=$(git diff --name-only --diff-filter=d "$base"..HEAD \
            | grep -E '^applications/electron/src/.*\.css$' \
            | sed 's|^applications/electron/||' || true)
          if [ -n "$css_files" ]; then
            (cd applications/electron && echo "$css_files" | xargs npx stylelint)
          fi
      - name: Vitest (RTL + real-backend)
        working-directory: applications/electron
        run: npm run test:unit

  lighthouse-renderer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: applications/electron/package-lock.json
          registry-url: "https://npm.pkg.github.com"
      - name: Install Electron deps
        working-directory: applications/electron
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci
      - name: Build renderer bundle
        working-directory: applications/electron
        run: npm run build
      - name: Lighthouse floor on the built renderer
        working-directory: applications/electron
        run: npx --yes @lhci/cli@0.14.x autorun --config=lighthouserc.json
      - name: Name the failing audits
        if: failure()
        working-directory: applications/electron
        run: |
          for f in .lighthouseci/lhr-*.json; do
            jq -r '[.categories.accessibility.auditRefs[].id] as $a11y | .audits | to_entries[] | select(.value.score != null and .value.score < 1 and ([.key] | inside($a11y))) | "A11Y \(.key): \(.value.title)\n\(.value.details.items // [] | map(.node.selector // .node.snippet // "") | join("\n"))"' "$f"
          done
