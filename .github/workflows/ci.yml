name: CI

on:
  push:
    branches: [main]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Install the pinned rustc so CI runs the same version
      # developers use locally. Keep this in sync with
      # `rust-toolchain.toml` at the repo root — rustup respects
      # the file locally, dtolnay's action needs the version
      # explicitly. Bumping Rust is a two-line change: this value
      # and the toml's `channel`.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # #222: skip caching target/ so the cache stays small enough
          # to save without hitting the runner's ~14GB disk limit.
          # Two disk-full failures today (runs 24507576081 and
          # 24490994629) both happened in the rust-cache Post step.
          # Keeping ~/.cargo/registry + ~/.cargo/git caches preserves
          # the dep-download speedup while dropping the biggest
          # artifact directory (webrtc + tokio + octocrab dominate
          # target/).
          cache-targets: "false"
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Test
        run: cargo test
        env:
          BPMUX_SESSION_BASE: ${{ runner.temp }}/bpmux-sessions
      - name: Audit
        run: |
          cargo install cargo-audit
          cargo audit

  # Contract drift check — runs the feature-gated integration suite
  # against live gh CLI + octocrab REST API. `needs: test` gates this
  # on the offline suite passing so we don't burn rate-limit budget on
  # already-broken code. Trunk-based development: every push to main
  # verifies contracts haven't drifted.
  #
  # Requires `GH_TOKEN_INTEGRATION` + `BPMUX_REPO_INTEGRATION` secrets.
  # Missing secrets fail the job with an explanatory message — NOT a
  # silent skip. Silent-skip would let a contract-drifting push go
  # through just because the repo wasn't configured.
  integration:
    runs-on: ubuntu-latest
    needs: test
    env:
      GH_TOKEN_INTEGRATION: ${{ secrets.GH_TOKEN_INTEGRATION }}
      BPMUX_REPO_INTEGRATION: ${{ secrets.BPMUX_REPO_INTEGRATION }}
    steps:
      - name: Check secret availability
        run: |
          if [ -z "$GH_TOKEN_INTEGRATION" ]; then
            echo "ERROR: GH_TOKEN_INTEGRATION secret not set." >&2
            echo "Integration tests require live gh auth to verify contracts." >&2
            echo "Add GH_TOKEN_INTEGRATION as a repo secret with a token scoped" >&2
            echo "to read issues + runs, alongside BPMUX_REPO_INTEGRATION" >&2
            echo "(owner/name format)." >&2
            exit 1
          fi
          if [ -z "$BPMUX_REPO_INTEGRATION" ]; then
            echo "ERROR: BPMUX_REPO_INTEGRATION secret not set." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
      - name: Install gh CLI
        run: |
          # gh CLI is preinstalled on ubuntu-latest runners as of 2023,
          # but guard in case the baseline image shifts.
          if ! command -v gh >/dev/null; then
            curl -sS https://webi.sh/gh | sh
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
      - name: Authenticate gh CLI
        run: printf '%s' "$GH_TOKEN_INTEGRATION" | gh auth login --with-token
      - name: Run integration tests
        env:
          # Test code reads standard `GH_TOKEN` and `BPMUX_REPO` names.
          # Map from the scoped *_INTEGRATION secrets to keep the test
          # code unchanged across local + CI invocation.
          GH_TOKEN: ${{ secrets.GH_TOKEN_INTEGRATION }}
          BPMUX_REPO: ${{ secrets.BPMUX_REPO_INTEGRATION }}
          BPMUX_SESSION_BASE: ${{ runner.temp }}/bpmux-sessions
        run: cargo test --features integration_tests -- --nocapture
