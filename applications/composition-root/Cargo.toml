[package]
name = "composition-root"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The composition root: the one place the server, cli, and mcp shells meet, so the shells never meet each other. Emits the single bpmux binary."

[[bin]]
name = "bpmux"
path = "src/main.rs"

[dependencies]
cli = { path = "../cli" }
server = { path = "../server" }
mcp = { path = "../mcp" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[dev-dependencies]
server = { path = "../server" }
store = { path = "../../components/store" }
kernel = { path = "../../components/kernel" }
hub = { path = "../../components/hub" }
bridge = { path = "../../components/bridge" }
transport = { path = "../../components/transport" }
room = { path = "../../components/room" }
message = { path = "../../components/message" }
message_log = { path = "../../components/message_log" }
product_management = { path = "../../components/product_management" }
integrations = { path = "../../components/integrations" }
workflow = { path = "../../components/workflow" }
sync = { path = "../../components/sync" }
ci = { path = "../../components/ci" }
serde_json = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }
tokio-tungstenite = "0.26"
reqwest = { workspace = true }
portable-pty = "0.9"
tempfile = { workspace = true }
httpmock = "0.8"
uuid = { workspace = true, features = ["v4"] }
futures = "0.3"
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
axum = { version = "0.8", features = ["ws"] }
board = { path = "../../components/board" }
auth = { path = "../../components/auth" }
bookmark = { path = "../../components/bookmark" }
location = { path = "../../components/location" }
telemetry = { path = "../../components/telemetry" }
diag = { path = "../../components/diag" }
electron_capture = { path = "../../components/electron_capture" }
protocol = { path = "../../components/protocol" }
storage = { path = "../../components/storage" }
futures-util = "0.3"
user_routing = { path = "../../components/user_routing" }
source_codec = { path = "../../components/source_codec" }
regex = "1"

[lints]
workspace = true
