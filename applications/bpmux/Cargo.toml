[package]
name = "bpmux"
version.workspace = true
edition.workspace = true
description = "P2P group chat for AI pair programming sessions"
license.workspace = true

[dependencies]
awareness = { path = "../../components/awareness" }
board = { path = "../../components/board" }
ci = { path = "../../components/ci" }
comprehension = { path = "../../components/comprehension" }
diag = { path = "../../components/diag" }
electron_capture = { path = "../../components/electron_capture" }
hub = { path = "../../components/hub" }
integrations = { path = "../../components/integrations" }
kernel = { path = "../../components/kernel" }
local_url = { path = "../../components/local_url" }
memory = { path = "../../components/memory" }
message = { path = "../../components/message" }
message_log = { path = "../../components/message_log" }
owner_session = { path = "../../components/owner_session" }
persist = { path = "../../components/persist" }
product_management = { path = "../../components/product_management" }
protocol = { path = "../../components/protocol" }
rate_limit = { path = "../../components/rate_limit" }
reactions = { path = "../../components/reactions" }
roster = { path = "../../components/roster" }
self_update = { path = "../../components/self_update" }
source_codec = { path = "../../components/source_codec" }
source_sync = { path = "../../components/source_sync" }
storage = { path = "../../components/storage" }
store = { path = "../../components/store" }
unfurl = { path = "../../components/unfurl" }
user_routing = { path = "../../components/user_routing" }
view = { path = "../../components/view" }
workflow = { path = "../../components/workflow" }
tokio = { workspace = true, features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
mcp_tools = { path = "../../components/mcp_tools" }
telemetry = { path = "../../components/telemetry" }
location = { path = "../../components/location" }
auth = { path = "../../components/auth" }
bookmark = { path = "../../components/bookmark" }
briefing = { path = "../../components/briefing" }
room = { path = "../../components/room" }
sync = { path = "../../components/sync" }
bridge = { path = "../../components/bridge" }
chrono = { workspace = true, features = ["serde"] }
dirs = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
thiserror = { workspace = true }
anyhow = "1"
futures = "0.3"
rmcp = { workspace = true, features = ["server", "client", "transport-async-rw", "transport-io", "transport-child-process", "transport-streamable-http-server", "transport-streamable-http-client-reqwest"] }
axum = { version = "0.8", features = ["ws"] }
tokio-tungstenite = "0.26"
tokio-util = { workspace = true, features = ["rt"] }
reqwest = { workspace = true }
ring = { workspace = true }
base64 = "0.22.1"
aho-corasick = { workspace = true }
rustls = { version = "0.23", features = ["ring"] }
tower-http = { version = "0.6", features = ["cors"] }
regex = "1"
url = { workspace = true }
http = { workspace = true }
toml = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
store_test_support = { path = "../../components/store_test_support" }
portable-pty = "0.9"
store = { path = "../../components/store", features = ["test-support"] }
reqwest = { workspace = true, features = ["json"] }
tokio = { workspace = true, features = ["full", "test-util"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
httpmock = "0.8"

[lints]
workspace = true
