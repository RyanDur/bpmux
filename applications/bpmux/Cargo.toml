[package]
name = "bpmux"
version.workspace = true
edition.workspace = true
description = "P2P group chat for AI pair programming sessions"
license.workspace = true

[dependencies]
kernel = { path = "../../components/kernel" }
message = { path = "../../components/message" }
tokio = { workspace = true, features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
dirs = "6"
uuid = { workspace = true, features = ["v4"] }
thiserror = "2"
anyhow = "1"
futures = "0.3"
rmcp = { version = "1.3.0", features = ["server", "client", "transport-async-rw", "transport-io", "transport-child-process", "transport-streamable-http-server", "transport-streamable-http-client-reqwest"] }
axum = { version = "0.8", features = ["ws"] }
tokio-tungstenite = "0.26"
tokio-util = { version = "0.7.18", features = ["rt"] }
reqwest = { version = "0.13.2" }
# Per Ryan 2026-04-30: tests must NEVER make HTTP calls outside the
# computer. Octocrab's default `rustls` feature pulls hyper-rustls
# with `native-tokio` which loads macOS Security Framework keychain
# at TLS-builder construction (rustls-native-certs); that's an OS
# call that fails when keychain is unavailable / sandboxed. Swap to
# `rustls-webpki-tokio` (bundled Mozilla CA list) so TLS init is
# pure in-memory — no OS handshake, no external call. Other default
# features stay on (follow-redirect, retry, timeout, tracing,
# default-client, rustls-ring).
octocrab = { version = "0.44", default-features = false, features = ["follow-redirect", "retry", "timeout", "tracing", "default-client", "rustls", "rustls-ring", "rustls-webpki-tokio"] }
ring = "0.17.14"
aes-gcm = "0.10.3"
base64 = "0.22.1"
webrtc = "0.17.1"
aho-corasick = "1.1.4"
rustls = { version = "0.23", features = ["ring"] }
tower-http = { version = "0.6", features = ["cors"] }
regex = "1"
url = "2"
once_cell = "1"
http = "1"
http-body-util = "0.1"
toml = "0.8"
portable-pty = "0.9"
strip-ansi-escapes = "0.2"
tempfile = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
refinery = { version = "0.8", features = ["rusqlite"] }

[dev-dependencies]
reqwest = { version = "0.13.2", features = ["json"] }
tokio = { workspace = true, features = ["full", "test-util"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
httpmock = "0.8"

[lints]
workspace = true
