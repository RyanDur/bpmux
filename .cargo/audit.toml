# cargo audit configuration (#202).
#
# Every ignored advisory needs a reason. No silent allowlisting —
# quality means every piece of the stack is something we trust
# completely, and when a risk is accepted the rationale is in the
# repo, not just in someone's head.
#
# Pre-push hook runs `cargo audit --deny warnings` so new advisories
# not in this list fail the push. Re-evaluate on upstream releases.

[advisories]
ignore = [
    # RUSTSEC-2025-0141 — bincode 1.3.3 unmaintained.
    # Transitive via syntect → tui-markdown.
    # Upstream status: syntect 5.3.0 (latest) still depends on bincode 1.x.
    # No maintained replacement for tui-markdown with comparable feature set.
    # Usage: syntect loads cached theme/syntax data; bincode deserializes
    # that cache. Not on any untrusted input path — the cached data ships
    # with syntect itself. Re-evaluate when syntect migrates off bincode.
    "RUSTSEC-2025-0141",

    # RUSTSEC-2017-0008 — serial 0.4.0 unmaintained.
    # Transitive via ratatui-testlib (dev-dependency) → portable-pty 0.8.1.
    # Our direct portable-pty dep is on 0.9 (serial2), but ratatui-testlib
    # pins 0.8. Test-only surface — not shipped in the bpmux binary.
    # Re-evaluate when ratatui-testlib bumps its portable-pty dep.
    "RUSTSEC-2017-0008",

    # RUSTSEC-2024-0320 — yaml-rust 0.4.5 unmaintained.
    # Same root as bincode: syntect → tui-markdown. syntect uses yaml-rust
    # to parse syntax/theme YAML files that ship with syntect itself — no
    # untrusted YAML ever reaches this parser in bpmux. Re-evaluate when
    # syntect migrates to yaml-rust-2 or saphyr.
    "RUSTSEC-2024-0320",

    # RUSTSEC-2026-0097 — rand unsound with custom logger.
    # Present in two places in the tree:
    # (1) rand 0.8.5 via phf → termwiz → ratatui. Compile-time only:
    #     phf_generator builds perfect hash maps at macro expansion. The
    #     advisory's failure mode (custom logger observing rand::rng() at
    #     runtime) is not reachable from build-time code.
    # (2) rand 0.9.2 via webrtc, tungstenite (axum ws), and quinn (reqwest).
    #     These libraries do not install custom rand loggers, and bpmux
    #     does not install one either. The unsound pattern requires a
    #     caller to instrument rand::rng() with a logger that can observe
    #     state across threads — that pattern does not exist in bpmux or
    #     its transitive runtime deps. Re-evaluate if webrtc/tungstenite/
    #     quinn bump their rand dep, or if bpmux ever adds logger
    #     instrumentation around rand calls.
    "RUSTSEC-2026-0097",
]
