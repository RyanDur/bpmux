[package]
name = "bpmux"
version = "0.1.0"
edition = "2024"
description = "P2P group chat for AI pair programming sessions"
license = "BUSL-1.1"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
ratatui = { version = "0.30", features = ["crossterm", "unstable-rendered-line-info"] }
crossterm = { version = "0.29", features = ["event-stream", "bracketed-paste"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
anyhow = "1"
futures = "0.3"
rmcp = { version = "1.3.0", features = ["server", "client", "transport-async-rw", "transport-io", "transport-child-process", "transport-streamable-http-server", "transport-streamable-http-client-reqwest"] }
axum = { version = "0.8", features = ["ws"] }
tokio-tungstenite = "0.26"
tokio-util = { version = "0.7.18", features = ["rt"] }
tui-markdown = "0.3.7"
reqwest = { version = "0.13.2" }

[dev-dependencies]
ratatui-testlib = "0.1.0"
tempfile = "3"
expectrl = "0.8.0"
portable-pty = "0.8"
reqwest = { version = "0.13.2", features = ["json"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "warn"
