[workspace]
resolver = "2"
members = [
    "applications/bpmux",
    "components/diag",
    "components/kernel",
    "components/message",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "BUSL-1.1"

[workspace.dependencies]
tokio = "1"
serde = "1"
serde_json = "1"
chrono = "0.4"
uuid = "1"

[workspace.lints.rust]
dead_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "warn"
