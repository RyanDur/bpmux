[workspace]
resolver = "2"
members = [
    "applications/composition-root",
    "applications/cli",
    "applications/mcp",
    "applications/server",
    "components/auth",
    "components/awareness",
    "components/board",
    "components/bridge",
    "components/bookmark",
    "components/briefing",
    "components/ci",
    "components/comprehension",
    "components/diag",
    "components/electron_capture",
    "components/hub",
    "components/integrations",
    "components/kernel",
    "components/local_url",
    "components/location",
    "components/mcp_tools",
    "components/memory",
    "components/message",
    "components/message_log",
    "components/owner_session",
    "components/persist",
    "components/product_management",
    "components/protocol",
    "components/rate_limit",
    "components/reactions",
    "components/room",
    "components/roster",
    "components/self_update",
    "components/source_codec",
    "components/source_sync",
    "components/storage",
    "components/store",
    "components/store_test_support",
    "components/sync",
    "components/telemetry",
    "components/transport",
    "components/unfurl",
    "components/user_routing",
    "components/view",
    "components/workflow",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "BUSL-1.1"

[workspace.dependencies]
tokio = "1"
http = "1"
serde = "1"
serde_json = "1"
chrono = "0.4"
uuid = "1"
thiserror = "2"
toml = "0.8"
tempfile = "3"
aho-corasick = "1.1.4"
dirs = "6"
tokio-util = "0.7.18"
url = "2"
reqwest = "0.13.2"
rmcp = "1.3.0"
ring = "0.17.14"

[workspace.lints.rust]
dead_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "warn"
