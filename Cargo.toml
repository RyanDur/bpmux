[workspace]
resolver = "2"
members = [
    "applications/bpmux",
    "components/awareness",
    "components/board",
    "components/comprehension",
    "components/diag",
    "components/kernel",
    "components/memory",
    "components/message",
    "components/message_log",
    "components/persist",
    "components/product_management",
    "components/reactions",
    "components/user_routing",
    "components/view",
    "components/workflow",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "BUSL-1.1"

[workspace.dependencies]
tokio = "1"
serde = "1"
serde_json = "1"
chrono = "0.4"
uuid = "1"
thiserror = "2"
toml = "0.8"
tempfile = "3"
aho-corasick = "1.1.4"
dirs = "6"

[workspace.lints.rust]
dead_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "warn"
