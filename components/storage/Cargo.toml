[package]
name = "storage"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The persistence edge: the sqlite store implementing the feature-owned repo ports over the injected database gateway"

[dependencies]
ci = { path = "../ci" }
awareness = { path = "../awareness" }
diag = { path = "../diag" }
memory = { path = "../memory" }
message = { path = "../message" }
message_log = { path = "../message_log" }
database-support = { path = "../database-support" }
persist = { path = "../persist" }
product_management = { path = "../product_management" }
source_sync = { path = "../source_sync" }
user_routing = { path = "../user_routing" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
