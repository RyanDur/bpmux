[package]
name = "database-support"
version = "0.1.0"
edition = "2024"
description = "Common functions over the conversation database: the gateway domains get injected, the migrations it applies, the query helpers they share"

[dependencies]
persist = { path = "../persist" }
rusqlite = { version = "0.32", features = ["bundled"] }
refinery = { version = "0.8", features = ["rusqlite"] }

[dev-dependencies]
tempfile = "3"
