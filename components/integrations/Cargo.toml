[package]
name = "integrations"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The source-integration adapters: the GitHub gateway/tracker anti-corruption home and the in-memory twin, implementing the domain's source ports"

[dependencies]
ci = { path = "../ci" }
database-support = { path = "../database-support" }
diag = { path = "../diag" }
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = { workspace = true }
product_management = { path = "../product_management" }
rate_limit = { path = "../rate_limit" }
source_codec = { path = "../source_codec" }
source_sync = { path = "../source_sync" }
workflow = { path = "../workflow" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
chrono = { workspace = true }
http = { workspace = true }
http-body-util = "0.1"
# Per Ryan 2026-04-30: tests must NEVER make HTTP calls outside the
# computer. Octocrab's default `rustls` feature pulls hyper-rustls
# with `native-tokio` which loads macOS Security Framework keychain
# at TLS-builder construction (rustls-native-certs); that's an OS
# call that fails when keychain is unavailable / sandboxed. Swap to
# `rustls-webpki-tokio` (bundled Mozilla CA list) so TLS init is
# pure in-memory — no OS handshake, no external call. Other default
# features stay on (follow-redirect, retry, timeout, tracing,
# default-client, rustls-ring).
octocrab = { version = "0.44", default-features = false, features = ["follow-redirect", "retry", "timeout", "tracing", "default-client", "rustls", "rustls-ring", "rustls-webpki-tokio"] }
rustls = { version = "0.23", features = ["ring"] }

# Platform-native keychain backends only. linux-native uses kernel
# keyutils (pure syscalls) so Linux CI builds without dbus/system
# libs; tests never construct the real adapter (fake secret store
# per the no-OS-calls-in-tests ruling above).
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
tempfile = { workspace = true }

[lints]
workspace = true
